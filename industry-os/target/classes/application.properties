server.port=${PORT:8080}

# Spring Application Name
spring.application.name=INDUSTRY-OS

# Default in-memory profile with MySQL compatibility for seamless local execution & testing
spring.datasource.url=jdbc:h2:mem:industrial_mgmt;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (available at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration
industryos.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
industryos.jwt.expiration-ms=86400000

# Logging
logging.level.com.industryos=INFO
logging.level.org.springframework.security=WARN

